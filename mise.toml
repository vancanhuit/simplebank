[settings]
lockfile = true
auto_install = false

[env]
'_'.source = { path = 'env.bash', tools =  true }

[tools]
cocogitto = "7.0.0"
go = "1.26.5"
golangci-lint = "2.12.2"
mkcert = "1.4.4"

[tasks."app"]
description = "Run the application"
run = 'go run cmd/app/main.go'

[tasks."app:build"]
description = "Build the application"
env = { CGO_ENABLED = "0" }
run = '''
#!/usr/bin/env bash

set -euo pipefail

go build \
  -trimpath \
  -buildvcs=false \
  -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
  -o dist/simplebank cmd/app/main.go
'''

[tasks."compose:dev:up"]
description = "Run docker compose for development"
run = 'docker compose --profile dev up -d --wait --build'

[tasks."compose:dev:down"]
description = "Stop docker compose for development"
run = 'docker compose --profile dev down -v'

[tasks."golangci-lint:fmt"]
description = "Format code with golangci-lint"
run = 'golangci-lint fmt -v ./cmd/... ./internal/...'

[tasks.golangci-lint]
description = "Run golangci-lint"
run = 'golangci-lint run -v ./cmd/... ./internal/...'

[tasks.govulncheck]
description = "Run govulncheck"
run = [
  'go install golang.org/x/vuln/cmd/govulncheck@latest',
  'govulncheck -show verbose ./cmd/... ./internal/...',
]

[tasks."test:unit"]
description = "Run unit tests"
run = 'go test -race -cover -v ./cmd/... ./internal/...'

[tasks."compose:test:up"]
description = "Run docker compose for testing"
run = 'docker compose --profile test up -d --wait'

[tasks."compose:test:down"]
description = "Stop docker compose for testing"
run = 'docker compose --profile test down -v'

[tasks."test:integration"]
description = "Run integration tests"
depends = ["compose:test:up"]
depends_post = ["compose:test:down"]
run = 'go test -race -cover -v ./cmd/... ./internal/... -tags=integration'

[tasks."docker:build"]
description = "Build docker image"
run = '''
#!/usr/bin/env bash

set -euo pipefail

docker buildx build --platform linux/amd64,linux/arm64 -t simplebank:latest --load \
  --build-arg VERSION="$VERSION" \
  --build-arg COMMIT="$COMMIT" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  .
'''

[tasks."hooks:install"]
description = "Install git hooks"
run = 'cog install-hook --all'

[tasks."sqlc:generate"]
description = "Generate Go code from SQL with sqlc"
run = ['go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest', 'sqlc generate']

[tasks."dev:tls:certs"]
description = "Generate TLS certificates for development"
outputs = ["tls/cert.pem", "tls/key.pem"]
run = [
  'mkdir -pv tls',
  'mkcert -cert-file tls/cert.pem -key-file tls/key.pem localhost 127.0.0.1 ::1',
]

[tasks."compose:dev-https:up"]
description = "Run docker compose for development with HTTPS"
depends = ["dev:tls:certs"]
run = 'docker compose --profile dev-https up -d --wait --build'

[tasks."compose:dev-https:down"]
description = "Stop docker compose for development with HTTPS"
run = 'docker compose --profile dev-https down -v'
