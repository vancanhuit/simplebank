[settings]
lockfile = true
auto_install = false

[env]
'_'.source = { path = 'env.bash', tools = true }

[tools]
bun = "1.3.14"
cocogitto = "7.0.0"
go = "1.26.5"
golangci-lint = "2.12.2"
mkcert = "1.4.4"

[tasks."app"]
description = "Run the application"
depends = ["frontend:build"]
run = 'go run cmd/app/main.go'

[tasks."app:build"]
description = "Build the single binary with the embedded SPA"
depends = ["frontend:build"]
env = { CGO_ENABLED = "0" }
run = '''
#!/usr/bin/env bash

set -euo pipefail

go build \
  -trimpath \
  -buildvcs=false \
  -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
  -o dist/simplebank cmd/app/main.go
'''

[tasks."compose:dev:up"]
description = "Run docker compose for development"
depends = ["dev:tls:certs"]
run = 'docker compose --profile dev up -d --wait --build'

[tasks."compose:dev:down"]
description = "Stop docker compose for development"
run = 'docker compose --profile dev down -v'

[tasks."golangci-lint:fmt"]
description = "Format code with golangci-lint"
run = 'golangci-lint fmt -v ./cmd/... ./internal/...'

[tasks.golangci-lint]
description = "Run golangci-lint"
depends = ["frontend:build"]
run = 'golangci-lint run -v ./cmd/... ./internal/...'

[tasks.govulncheck]
description = "Run govulncheck"
depends = ["frontend:build"]
run = [
  'go install golang.org/x/vuln/cmd/govulncheck@latest',
  'govulncheck -show verbose ./cmd/... ./internal/...',
]

[tasks."test:unit"]
description = "Run unit tests"
depends = ["frontend:build"]
run = 'go test -race -cover -v ./cmd/... ./internal/...'

[tasks."compose:test:up"]
description = "Run docker compose for testing"
run = 'docker compose --profile test up -d --wait'

[tasks."compose:test:down"]
description = "Stop docker compose for testing"
run = 'docker compose --profile test down -v'

[tasks."test:integration"]
description = "Run integration tests"
depends = ["frontend:build", "compose:test:up"]
depends_post = ["compose:test:down"]
run = 'go test -race -cover -v ./cmd/... ./internal/... -tags=integration'

[tasks."docker:build"]
description = "Build docker image"
run = '''
#!/usr/bin/env bash

set -euo pipefail

docker buildx build --platform linux/amd64,linux/arm64 -t simplebank:latest --load \
  --build-arg VERSION="$VERSION" \
  --build-arg COMMIT="$COMMIT" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  .
'''

[tasks."hooks:install"]
description = "Install git hooks"
run = 'cog install-hook --all'

[tasks."sqlc:generate"]
description = "Generate Go code from SQL with sqlc"
run = ['go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest', 'sqlc generate']

[tasks."dev:tls:certs"]
description = "Generate TLS certificates for development"
outputs = [
  "tls/cert.pem",
  "tls/key.pem",
  "tls/mailpit-cert.pem",
  "tls/mailpit-key.pem",
  "tls/rootCA.pem",
]
run = [
  'mkdir -pv tls',
  'mkcert -cert-file tls/cert.pem -key-file tls/key.pem localhost 127.0.0.1 ::1',
  # Mailpit serves SMTP over TLS, so its certificate must be valid for the
  # compose service names the app/worker dial across the dev profiles.
  'mkcert -cert-file tls/mailpit-cert.pem -key-file tls/mailpit-key.pem mailpit-dev mailpit-dev-https mailpit-dev-proxy localhost',
  # Export the mkcert root so the app container (which lacks the host trust
  # store) can verify Mailpit's certificate via SMTP_TLS_CA_FILE.
  'cp -v "$(mkcert -CAROOT)/rootCA.pem" tls/rootCA.pem',
  # The app runs as a non-root user inside the container, so the mkcert keys
  # (written 0600, owned by the host user) would be unreadable. These are
  # throwaway localhost dev certs, never real secrets, so relax the mode.
  'chmod 0644 tls/key.pem tls/mailpit-key.pem',
]

[tasks."compose:dev-https:up"]
description = "Run docker compose for development with HTTPS"
depends = ["dev:tls:certs"]
run = 'docker compose --profile dev-https up -d --wait --build'

[tasks."compose:dev-https:down"]
description = "Stop docker compose for development with HTTPS"
run = 'docker compose --profile dev-https down -v'

[tasks."compose:dev-proxy:up"]
description = "Run docker compose with a Caddy reverse proxy in front (proxy-aware topology)"
depends = ["dev:tls:certs"]
run = 'docker compose --profile dev-proxy up -d --wait --build'

[tasks."compose:dev-proxy:down"]
description = "Stop docker compose proxy-aware topology"
run = 'docker compose --profile dev-proxy down -v'

[tasks."frontend:install"]
description = "Install frontend dependencies"
dir = "frontend"
run = 'bun install --frozen-lockfile'

[tasks."frontend:dev"]
description = "Run the frontend dev server"
dir = "frontend"
run = 'bun run dev'

[tasks."frontend:build"]
description = "Build the frontend for production"
dir = "frontend"
depends = ["frontend:install"]
run = 'bun run build'

[tasks."frontend:preview"]
description = "Preview the production frontend build"
dir = "frontend"
run = 'bun run preview'

[tasks."frontend:check"]
description = "Type-check the frontend (svelte-check + tsc)"
dir = "frontend"
run = 'bun run check'

[tasks."frontend:test"]
description = "Run the frontend unit tests (Vitest)"
dir = "frontend"
run = 'bun run test'

[tasks."frontend:lint"]
description = "Lint the frontend with ESLint"
dir = "frontend"
run = 'bun run lint'

[tasks."frontend:lint:fix"]
description = "Lint and auto-fix the frontend with ESLint"
dir = "frontend"
run = 'bun run lint:fix'

[tasks."frontend:format"]
description = "Format the frontend with Prettier"
dir = "frontend"
run = 'bun run format'

[tasks."frontend:format:check"]
description = "Check frontend formatting with Prettier"
dir = "frontend"
run = 'bun run format:check'
