name: simplebank

x-postgres: &x-postgres-base
  image: postgres:18-trixie
  restart: unless-stopped

x-mailpit: &x-mailpit-base
  image: axllent/mailpit:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/mailpit", "readyz"]
    interval: 5s
    timeout: 30s
    retries: 5
    start_period: 5s

# Realistic dev Mailpit: SMTP over implicit TLS (SSL) on port 465 with auth.
# MP_SMTP_REQUIRE_TLS enforces SSL/TLS (disabling STARTTLS on the same port),
# and MP_SMTP_AUTH_FILE turns on username/password auth. The cert is a
# mkcert-signed cert valid for the mailpit-* service names (see the
# `dev:tls:certs` mise task); the auth file holds throwaway dev credentials.
x-mailpit-tls: &x-mailpit-tls-base
  image: axllent/mailpit:latest
  restart: unless-stopped
  environment:
    MP_SMTP_BIND_ADDR: "0.0.0.0:465"
    MP_SMTP_TLS_CERT: "/tls/mailpit-cert.pem"
    MP_SMTP_TLS_KEY: "/tls/mailpit-key.pem"
    MP_SMTP_REQUIRE_TLS: "true"
    MP_SMTP_AUTH_FILE: "/etc/mailpit/smtp-auth.txt"
  volumes:
    - ./tls:/tls:ro
    - ./mailpit/smtp-auth.txt:/etc/mailpit/smtp-auth.txt:ro
  healthcheck:
    test: ["CMD", "/mailpit", "readyz"]
    interval: 5s
    timeout: 30s
    retries: 5
    start_period: 5s

x-app: &x-app-base
  build:
    context: .
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
  command: ["serve"]
  # The distroless image has no shell/curl, so the binary probes itself. It
  # reads HTTP_ADDR and TLS_CERT_FILE from each service's environment to pick
  # the right port and scheme.
  healthcheck:
    test: ["CMD", "/simplebank", "healthcheck"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 5s

x-pgadmin: &x-pgadmin-base
  image: dpage/pgadmin4:latest
  restart: unless-stopped
  # Desktop mode: skip pgAdmin's own login screen and master-password prompt so
  # the web UI opens straight to the pre-loaded server list. These are dev-only
  # conveniences — never disable pgAdmin auth on a real deployment.
  environment:
    # pgAdmin rejects reserved TLDs like .local for the admin email, so use a
    # generic example.com address. Both values are throwaway dev credentials.
    PGADMIN_DEFAULT_EMAIL: "admin@example.com"
    PGADMIN_DEFAULT_PASSWORD: "simplebank"
    PGADMIN_CONFIG_SERVER_MODE: "False"
    PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
  healthcheck:
    test:
      ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/misc/ping')"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

# NOTE: the JWT_SECRET and Postgres credentials below are throwaway values for
# local dev/CI profiles only. Never reuse them anywhere real — production
# secrets belong in a secrets manager.

services:
  postgres-test:
    <<: *x-postgres-base
    profiles:
      - test
    environment:
      POSTGRES_USER: simplebank_test
      POSTGRES_PASSWORD: simplebank_test
      POSTGRES_DB: simplebank_test
    ports:
      - "5433:5432"
    networks:
      - test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_test", "-d", "simplebank_test"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  mailpit-test:
    <<: *x-mailpit-base
    profiles:
      - test
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - test

  postgres-dev:
    <<: *x-postgres-base
    profiles:
      - dev
    environment:
      POSTGRES_USER: simplebank_dev
      POSTGRES_PASSWORD: simplebank_dev
      POSTGRES_DB: simplebank_dev
    ports:
      - "5432:5432"
    networks:
      - dev
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_dev", "-d", "simplebank_dev"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  mailpit-dev:
    <<: *x-mailpit-tls-base
    profiles:
      - dev
    ports:
      - "8025:8025"
      - "465:465"
    networks:
      - dev

  app-dev:
    <<: *x-app-base
    environment:
      HTTP_ADDR: ":8080"
      DB_SOURCE: "postgres://simplebank_dev:simplebank_dev@postgres-dev:5432/simplebank_dev?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev"
      SMTP_PORT: "465"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_SSL: "true"
      SMTP_USERNAME: "simplebank"
      SMTP_PASSWORD: "simplebank"
      SMTP_TLS_CA_FILE: "/tls/rootCA.pem"
      PUBLIC_BASE_URL: "http://localhost:8080"
    volumes:
      - ./tls:/tls:ro
    ports:
      - "8080:8080"
    networks:
      - dev
    depends_on:
      postgres-dev:
        condition: service_healthy
    profiles:
      - dev

  worker-dev:
    <<: *x-app-base
    command: ["worker"]
    # The worker exposes no HTTP listener, so the self-probing HTTP healthcheck
    # inherited from the app base does not apply.
    healthcheck:
      disable: true
    environment:
      DB_SOURCE: "postgres://simplebank_dev:simplebank_dev@postgres-dev:5432/simplebank_dev?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev"
      SMTP_PORT: "465"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_SSL: "true"
      SMTP_USERNAME: "simplebank"
      SMTP_PASSWORD: "simplebank"
      SMTP_TLS_CA_FILE: "/tls/rootCA.pem"
      PUBLIC_BASE_URL: "http://localhost:8080"
    volumes:
      - ./tls:/tls:ro
    networks:
      - dev
    depends_on:
      # Wait for the app to run migrations and become healthy; the worker also
      # runs migrations on startup, so serializing avoids a concurrent-apply race.
      app-dev:
        condition: service_healthy
    profiles:
      - dev

  pgadmin-dev:
    <<: *x-pgadmin-base
    profiles:
      - dev
    ports:
      - "5050:80"
    volumes:
      # Pre-registers the postgres-dev server; you still enter the dev password
      # (simplebank_dev) once on first connect and can let pgAdmin save it.
      - ./pgadmin/servers-dev.json:/pgadmin4/servers.json:ro
    networks:
      - dev
    depends_on:
      postgres-dev:
        condition: service_healthy

  mailpit-dev-https:
    <<: *x-mailpit-tls-base
    profiles:
      - dev-https
    ports:
      - "8027:8025"
      - "467:465"
    networks:
      - dev-https

  postgres-dev-https:
    <<: *x-postgres-base
    profiles:
      - dev-https
    environment:
      POSTGRES_USER: simplebank_dev_https
      POSTGRES_PASSWORD: simplebank_dev_https
      POSTGRES_DB: simplebank_dev_https
    ports:
      - "5434:5432"
    networks:
      - dev-https
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_dev_https", "-d", "simplebank_dev_https"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  app-dev-https:
    <<: *x-app-base
    environment:
      HTTP_ADDR: ":8443"
      DB_SOURCE: "postgres://simplebank_dev_https:simplebank_dev_https@postgres-dev-https:5432/simplebank_dev_https?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev-https"
      SMTP_PORT: "465"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_SSL: "true"
      SMTP_USERNAME: "simplebank"
      SMTP_PASSWORD: "simplebank"
      SMTP_TLS_CA_FILE: "/tls/rootCA.pem"
      PUBLIC_BASE_URL: "https://localhost:8443"
      TLS_CERT_FILE: "/tls/cert.pem"
      TLS_KEY_FILE: "/tls/key.pem"
    volumes:
      - ./tls:/tls:ro
    ports:
      - "8443:8443"
    networks:
      - dev-https
    depends_on:
      postgres-dev-https:
        condition: service_healthy
    profiles:
      - dev-https

  worker-dev-https:
    <<: *x-app-base
    command: ["worker"]
    # The worker exposes no HTTP listener, so the self-probing HTTP healthcheck
    # inherited from the app base does not apply.
    healthcheck:
      disable: true
    environment:
      DB_SOURCE: "postgres://simplebank_dev_https:simplebank_dev_https@postgres-dev-https:5432/simplebank_dev_https?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev-https"
      SMTP_PORT: "465"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_SSL: "true"
      SMTP_USERNAME: "simplebank"
      SMTP_PASSWORD: "simplebank"
      SMTP_TLS_CA_FILE: "/tls/rootCA.pem"
      PUBLIC_BASE_URL: "https://localhost:8443"
    volumes:
      - ./tls:/tls:ro
    networks:
      - dev-https
    depends_on:
      # Wait for the app to run migrations and become healthy; the worker also
      # runs migrations on startup, so serializing avoids a concurrent-apply race.
      app-dev-https:
        condition: service_healthy
    profiles:
      - dev-https

  pgadmin-dev-https:
    <<: *x-pgadmin-base
    profiles:
      - dev-https
    ports:
      - "5051:80"
    volumes:
      # Pre-registers the postgres-dev-https server; enter the dev password
      # (simplebank_dev_https) once on first connect.
      - ./pgadmin/servers-dev-https.json:/pgadmin4/servers.json:ro
    networks:
      - dev-https
    depends_on:
      postgres-dev-https:
        condition: service_healthy

  mailpit-dev-proxy:
    <<: *x-mailpit-tls-base
    profiles:
      - dev-proxy
    ports:
      - "8028:8025"
      - "468:465"
    networks:
      - dev-proxy

  postgres-dev-proxy:
    <<: *x-postgres-base
    profiles:
      - dev-proxy
    environment:
      POSTGRES_USER: simplebank_dev_proxy
      POSTGRES_PASSWORD: simplebank_dev_proxy
      POSTGRES_DB: simplebank_dev_proxy
    ports:
      - "5435:5432"
    networks:
      - dev-proxy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_dev_proxy", "-d", "simplebank_dev_proxy"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  app-dev-proxy:
    <<: *x-app-base
    environment:
      HTTP_ADDR: ":8080"
      DB_SOURCE: "postgres://simplebank_dev_proxy:simplebank_dev_proxy@postgres-dev-proxy:5432/simplebank_dev_proxy?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev-proxy"
      SMTP_PORT: "465"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_SSL: "true"
      SMTP_USERNAME: "simplebank"
      SMTP_PASSWORD: "simplebank"
      SMTP_TLS_CA_FILE: "/tls/rootCA.pem"
      # Client-facing URL is the Caddy proxy, not the app's own :8080 listener,
      # so verification-email links resolve for users behind the proxy.
      PUBLIC_BASE_URL: "https://localhost:8444"
      # Trust only the pinned proxy subnet so a spoofed X-Forwarded-For from a
      # directly-connected client is ignored.
      TRUSTED_PROXIES: "172.31.0.0/24"
    volumes:
      - ./tls:/tls:ro
    networks:
      - dev-proxy
    depends_on:
      postgres-dev-proxy:
        condition: service_healthy
    profiles:
      - dev-proxy

  worker-dev-proxy:
    <<: *x-app-base
    command: ["worker"]
    # The worker exposes no HTTP listener, so the self-probing HTTP healthcheck
    # inherited from the app base does not apply.
    healthcheck:
      disable: true
    environment:
      DB_SOURCE: "postgres://simplebank_dev_proxy:simplebank_dev_proxy@postgres-dev-proxy:5432/simplebank_dev_proxy?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev-proxy"
      SMTP_PORT: "465"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_SSL: "true"
      SMTP_USERNAME: "simplebank"
      SMTP_PASSWORD: "simplebank"
      SMTP_TLS_CA_FILE: "/tls/rootCA.pem"
      PUBLIC_BASE_URL: "https://localhost:8444"
    volumes:
      - ./tls:/tls:ro
    networks:
      - dev-proxy
    depends_on:
      # Wait for the app to run migrations and become healthy; the worker also
      # runs migrations on startup, so serializing avoids a concurrent-apply race.
      app-dev-proxy:
        condition: service_healthy
    profiles:
      - dev-proxy

  pgadmin-dev-proxy:
    <<: *x-pgadmin-base
    profiles:
      - dev-proxy
    ports:
      - "5052:80"
    volumes:
      # Pre-registers the postgres-dev-proxy server; enter the dev password
      # (simplebank_dev_proxy) once on first connect.
      - ./pgadmin/servers-dev-proxy.json:/pgadmin4/servers.json:ro
    networks:
      - dev-proxy
    depends_on:
      postgres-dev-proxy:
        condition: service_healthy

  caddy-dev-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - dev-proxy
    ports:
      - "8444:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
    networks:
      - dev-proxy
    depends_on:
      app-dev-proxy:
        condition: service_healthy

networks:
  dev:
  test:
  dev-https:
  dev-proxy:
    ipam:
      config:
        - subnet: 172.31.0.0/24
