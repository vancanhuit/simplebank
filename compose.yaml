name: simplebank

x-postgres: &x-postgres-base
  image: postgres:18-trixie
  restart: unless-stopped

x-mailpit: &x-mailpit-base
  image: axllent/mailpit:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/mailpit", "readyz"]
    interval: 5s
    timeout: 30s
    retries: 5
    start_period: 5s

x-app: &x-app-base
  build:
    context: .
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
  command: ["serve"]

services:
  postgres-test:
    <<: *x-postgres-base
    profiles:
      - test
    environment:
      POSTGRES_USER: simplebank_test
      POSTGRES_PASSWORD: simplebank_test
      POSTGRES_DB: simplebank_test
    ports:
      - "5433:5432"
    networks:
      - test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_test", "-d", "simplebank_test"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  mailpit-test:
    <<: *x-mailpit-base
    profiles:
      - test
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - test

  postgres-dev:
    <<: *x-postgres-base
    profiles:
      - dev
    environment:
      POSTGRES_USER: simplebank_dev
      POSTGRES_PASSWORD: simplebank_dev
      POSTGRES_DB: simplebank_dev
    ports:
      - "5432:5432"
    networks:
      - dev
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_dev", "-d", "simplebank_dev"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  mailpit-dev:
    <<: *x-mailpit-base
    profiles:
      - dev
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - dev

  app-dev:
    <<: *x-app-base
    environment:
      HTTP_ADDR: ":8080"
      DB_SOURCE: "postgres://simplebank_dev:simplebank_dev@postgres-dev:5432/simplebank_dev?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev"
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_INSECURE: "true"
    ports:
      - "8080:8080"
    networks:
      - dev
    depends_on:
      postgres-dev:
        condition: service_healthy
    profiles:
      - dev

  mailpit-dev-https:
    <<: *x-mailpit-base
    profiles:
      - dev-https
    ports:
      - "8027:8025"
      - "1027:1025"
    networks:
      - dev-https

  postgres-dev-https:
    <<: *x-postgres-base
    profiles:
      - dev-https
    environment:
      POSTGRES_USER: simplebank_dev_https
      POSTGRES_PASSWORD: simplebank_dev_https
      POSTGRES_DB: simplebank_dev_https
    ports:
      - "5434:5432"
    networks:
      - dev-https
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_dev_https", "-d", "simplebank_dev_https"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  app-dev-https:
    <<: *x-app-base
    environment:
      HTTP_ADDR: ":8443"
      DB_SOURCE: "postgres://simplebank_dev_https:simplebank_dev_https@postgres-dev-https:5432/simplebank_dev_https?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev-https"
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_INSECURE: "true"
      TLS_CERT_FILE: "/tls/cert.pem"
      TLS_KEY_FILE: "/tls/key.pem"
    volumes:
      - ./tls:/tls:ro
    ports:
      - "8443:8443"
    networks:
      - dev-https
    depends_on:
      postgres-dev-https:
        condition: service_healthy
    profiles:
      - dev-https

  mailpit-dev-proxy:
    <<: *x-mailpit-base
    profiles:
      - dev-proxy
    ports:
      - "8028:8025"
      - "1028:1025"
    networks:
      - dev-proxy

  postgres-dev-proxy:
    <<: *x-postgres-base
    profiles:
      - dev-proxy
    environment:
      POSTGRES_USER: simplebank_dev_proxy
      POSTGRES_PASSWORD: simplebank_dev_proxy
      POSTGRES_DB: simplebank_dev_proxy
    ports:
      - "5435:5432"
    networks:
      - dev-proxy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simplebank_dev_proxy", "-d", "simplebank_dev_proxy"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  app-dev-proxy:
    <<: *x-app-base
    environment:
      HTTP_ADDR: ":8080"
      DB_SOURCE: "postgres://simplebank_dev_proxy:simplebank_dev_proxy@postgres-dev-proxy:5432/simplebank_dev_proxy?sslmode=disable"
      JWT_SECRET: "0123456789012345678901234567890123456789"
      SMTP_HOST: "mailpit-dev-proxy"
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@simplebank.local"
      SMTP_INSECURE: "true"
      # Trust only the pinned proxy subnet so a spoofed X-Forwarded-For from a
      # directly-connected client is ignored.
      TRUSTED_PROXIES: "172.31.0.0/24"
    networks:
      - dev-proxy
    depends_on:
      postgres-dev-proxy:
        condition: service_healthy
    profiles:
      - dev-proxy

  caddy-dev-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - dev-proxy
    ports:
      - "8444:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
    networks:
      - dev-proxy
    depends_on:
      - app-dev-proxy

networks:
  dev:
  test:
  dev-https:
  dev-proxy:
    ipam:
      config:
        - subnet: 172.31.0.0/24
