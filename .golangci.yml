version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - gosec
    - interfacebloat
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  exclusions:
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - noctx
      - path: _test\.go
        text: "G(101|112|124):"
        linters:
          - gosec

run:
  timeout: 15m
  issues-exit-code: 1
  tests: true
  enable-build-vcs: false
  allow-parallel-runners: false
  allow-serial-runners: false
