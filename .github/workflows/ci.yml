name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: the pipeline only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
        with:
          id: golangci-lint
          lint: "true"
      - run: |
          mise run golangci-lint:fmt
          git diff --exit-code .
          mise run golangci-lint

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
        with:
          id: govulncheck
      - run: |
          mise run govulncheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
        with:
          id: unit
      - run: |
          mise run test:unit

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
        with:
          id: build
      - run: |
          mise run app:build
          ls -alhs dist/
          file dist/simplebank

          dist/simplebank version

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Cache Bun's global install cache, keyed on the lockfile so it only
      # invalidates when dependencies change.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: mise run frontend:install
      - run: mise run frontend:check
      - run: mise run frontend:test
      - run: mise run frontend:lint
      - run: mise run frontend:format:check
      - run: mise run frontend:build

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Cache Bun's global install cache separately from browser binaries;
      # Playwright pins and manages its own Chromium revision.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: mise run frontend:test:e2e:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    # Only pay for Docker + integration once the code compiles, lints and
    # passes unit tests. A cheap failure skips this job instead of running it.
    needs: [golangci-lint, unit, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: latest
      - uses: ./.github/actions/go-cache
        with:
          id: test
      - run: |
          mise run test:integration

  smoke:
    runs-on: ubuntu-latest
    needs: [golangci-lint, unit, build]
    timeout-minutes: 20
    env:
      # Pin the mkcert CA location so `dev:tls:certs` and the curl check below
      # agree on where rootCA.pem lives. No `mkcert -install`, so no root/sudo.
      CAROOT: ${{ github.workspace }}/.mkcert
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: latest
      - run: |
          mise run compose:dev:up
          mise run compose:dev-https:up
          mise run compose:dev-proxy:up
      - name: HTTP smoke test
        run: |
          curl -sSf -v --retry 5 --retry-connrefused \
            http://localhost:8080/livez
      - name: HTTPS smoke test (trust mkcert CA via --cacert)
        run: |
          curl -sSf -v --retry 5 --retry-connrefused \
            --cacert "$CAROOT/rootCA.pem" \
            https://localhost:8443/livez
      - name: Reverse-proxy smoke test (Caddy terminates TLS, app behind proxy)
        run: |
          curl -sSf -v --retry 5 --retry-connrefused \
            --cacert "$CAROOT/rootCA.pem" \
            https://localhost:8444/livez
      - if: always()
        run: |
          mise run compose:dev:down
          mise run compose:dev-https:down
          mise run compose:dev-proxy:down

  docker:
    runs-on: ubuntu-latest
    needs: [golangci-lint, unit, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - name: Derive build metadata
        run: |
          source env.bash
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          tags: simplebank:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          # Persist layers across runs; the Dockerfile's cache mounts do not
          # survive on ephemeral runners without a backing cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker image ls
          docker image inspect simplebank:latest
