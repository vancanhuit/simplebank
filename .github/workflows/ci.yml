name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: |
          mise run golangci-lint:fmt
          git diff --exit-code .
          mise run golangci-lint

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: |
          mise run govulncheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: |
          mise run app:build
          ls -alhs dist/
          file dist/simplebank

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: latest
      - run: |
          mise run test:integration

  smoke:
    runs-on: ubuntu-latest
    env:
      # Pin the mkcert CA location so `dev:tls:certs` and the curl check below
      # agree on where rootCA.pem lives. No `mkcert -install`, so no root/sudo.
      CAROOT: ${{ github.workspace }}/.mkcert
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-compose-action@v2
        with:
          version: latest
      - run: |
          mise run compose:dev:up
          mise run compose:dev-https:up
      - name: HTTP smoke test
        run: |
          curl -sSf -v --retry 5 --retry-connrefused \
            http://localhost:8080/livez
      - name: HTTPS smoke test (trust mkcert CA via --cacert)
        run: |
          curl -sSf -v --retry 5 --retry-connrefused \
            --cacert "$CAROOT/rootCA.pem" \
            https://localhost:8443/livez
      - if: always()
        run: |
          mise run compose:dev:down
          mise run compose:dev-https:down

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - run: |
          mise run docker:build
          docker image ls
          docker image inspect simplebank:latest
