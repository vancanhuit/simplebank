name: Release

# Fires only on semantic version tags like v0.0.0, v1.2.3. The tag itself is
# the single source of truth for the version: env.bash derives VERSION from
# `git describe --tags`, so on a tag push that resolves to the exact tag name.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Serialize releases per tag; a re-run cancels a stale in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. Only the job that needs a scope gets it.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check-supply-chain.sh
      - run: scripts/check-supply-chain-regression.sh

  # Cross-compile the single binary (with embedded SPA) for each target and
  # publish a tar.gz per platform as a build artifact for the release job.
  binaries:
    runs-on: ubuntu-latest
    needs: [supply-chain]
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.9
          sha256: 997b6f3e0d760d292eb99f2824c70dddb432514b3a0d487f975c0f22b3cae430
      - uses: ./.github/actions/go-cache
        with:
          id: release-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Derive build metadata
        run: |
          source env.bash
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: mise run app:build
      - name: Package tarball
        run: |
          set -euo pipefail
          name="simplebank-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "out/${name}"
          cp dist/simplebank "out/${name}/simplebank"
          cp README.md "out/${name}/"
          tar -C out -czf "out/${name}.tar.gz" "${name}"
          ( cd out && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            out/*.tar.gz
            out/*.sha256
          if-no-files-found: error
          retention-days: 1

  # Build and push the multi-arch image to GHCR. Tags/labels are derived from
  # the git tag by metadata-action (e.g. v1.2.3, 1.2.3, 1.2, latest).
  docker:
    runs-on: ubuntu-latest
    needs: [supply-chain]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: 29.7.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
      - name: Derive build metadata
        run: |
          source env.bash
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Generate the changelog from conventional commits and cut the GitHub release
  # with the binaries attached. Runs only after binaries and image succeed.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.9
          sha256: 997b6f3e0d760d292eb99f2824c70dddb432514b3a0d487f975c0f22b3cae430
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: dist-artifacts
          merge-multiple: true
      - name: Generate changelog
        run: |
          set -euo pipefail
          # cog.toml pins tag_prefix and the custom template, so --at resolves
          # the v-prefixed tag and renders a titled, linked changelog with
          # author @mentions derived from the commit signature.
          cog changelog --at "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist-artifacts/*
